# LinkTalk server — разработчик makss1c (https://t.me/makss1c, makss.1c@yandex.ru)
# Запуск:  cp .env.example .env  →  укажите LINKTALK_PUBLIC_IP  →  docker compose up -d --build
services:
  linktalk:
    build:
      context: .
      args:
        LINKTALK_VERSION: "1.5.17-linktalk.1"
    image: linktalk:latest
    container_name: linktalk
    restart: unless-stopped
    environment:
      # LAN-адрес сервера, по которому подключаются клиенты (обязательно)
      PUBLIC_IP: ${LINKTALK_PUBLIC_IP:?Укажите LINKTALK_PUBLIC_IP в .env}
      PORT: ${LINKTALK_PORT:-8443}
      HTTP_PORT: ${LINKTALK_HTTP_PORT:-8080}
      MDNS_HOST: "off"
      LINKTALK_RTC_PORT_START: ${LINKTALK_RTC_PORT_START:-40000}
      LINKTALK_RTC_PORT_COUNT: ${LINKTALK_RTC_PORT_COUNT:-200}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${LINKTALK_PORT:-8443}:${LINKTALK_PORT:-8443}"
      - "${LINKTALK_HTTP_PORT:-8080}:${LINKTALK_HTTP_PORT:-8080}"
      # диапазон RTC должен совпадать с START/COUNT выше (по умолчанию 40000–40199)
      - "40000-40199:40000-40199/udp"
      - "40000-40199:40000-40199/tcp"
    volumes:
      - linktalk_data:/data
volumes:
  linktalk_data:
