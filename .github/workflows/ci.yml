name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm test
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: mobile-app/package-lock.json }
      - run: npm ci
        working-directory: mobile-app
      - run: npm test
        working-directory: mobile-app
      - run: npm run typecheck
        working-directory: mobile-app
